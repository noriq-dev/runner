key = "RUN"
repositoryKey = "noriq-runner"
defaultBranch = "main"

[sourceControl]
backend = "auto"
mode = "isolated"
base = "main"
landing = "manual"
target = "main"
# retain (the default) leaves accepted output for a human-managed merge.
# manual exposes Accept & land in Noriq; auto lands every succeeded job.
# Direct mode commits accepted work to its target immediately, so landing stays retain:
# mode = "direct"
# target = "feature/my-branch"
# landing = "retain"

[harness]
maxParallelTasks = 2
maxRepairRounds = 2
maxJobMinutes = 240

[agents.guide]
driver = "codex"
model = "gpt-5.6-sol"
effort = "high"

[agents.builder]
driver = "claude"
model = "sonnet"
effort = "medium"

[agents.reviewer]
driver = "codex"
model = "gpt-5.6-sol"
effort = "high"

[setup]
commands = ["npm ci"]
timeoutSeconds = 900

[checks]
commands = ["npm run check"]
timeoutSeconds = 900
