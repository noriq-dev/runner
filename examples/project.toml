key = "RUN"
repositoryKey = "noriq-runner"
defaultBranch = "main"

[sourceControl]
backend = "auto"
mode = "isolated"
base = "main"
landing = "manual"
target = "main"
# retain (the default) leaves accepted output for a human-managed merge.
# manual exposes Accept & land in Noriq; auto lands every succeeded job.
# Direct mode commits accepted work to its target immediately, so landing stays retain:
# mode = "direct"
# target = "feature/my-branch"
# landing = "retain"

[harness]
maxParallelTasks = 2
maxRepairRounds = 2
maxJobMinutes = 240

[agents.guide.economy]
driver = "codex"
model = "gpt-5.6-luna"
effort = "medium"

[agents.guide.balanced]
driver = "codex"
model = "gpt-5.6-terra"
effort = "high"

[agents.guide.strong]
driver = "codex"
model = "gpt-5.6-sol"
effort = "high"

[agents.builder.economy]
driver = "claude"
model = "sonnet"
effort = "low"

[agents.builder.balanced]
driver = "claude"
model = "sonnet"
effort = "medium"

[agents.builder.strong]
driver = "claude"
model = "sonnet"
effort = "high"

[agents.reviewer.economy]
driver = "codex"
model = "gpt-5.6-terra"
effort = "medium"

[agents.reviewer.balanced]
driver = "codex"
model = "gpt-5.6-terra"
effort = "high"

[agents.reviewer.strong]
driver = "codex"
model = "gpt-5.6-sol"
effort = "high"

# [agents.repairer] is optional; all three tiers default to the corresponding
# builder profiles.

[routing]
elevatedPathPrefixes = ["scripts", "package.json", "package-lock.json"]
criticalPathPrefixes = ["src/drivers", "src/vcs", "src/supervisor.ts", "src/state.ts"]

[setup]
commands = ["npm ci"]
timeoutSeconds = 900

[checks]
commands = ["npm run check"]
timeoutSeconds = 900
