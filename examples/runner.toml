[runner]
# Optional for a new installation; Runner persists the server-issued ID.
# id = "existing-registered-runner-id"
label = "build-runner"
serverUrl = "https://noriq.example"
# OAuth credentials are the default. `tokenEnv` and deprecated literal `token`
# remain higher-precedence compatibility options.
stateDirectory = "/var/lib/noriq-runner"
scanRoots = ["/srv/projects"]
maxConcurrentJobs = 2

[auth.noriq]
credentialsFile = "/var/lib/noriq-runner/credentials.json"

[discovery]
intervalSeconds = 60
maxDepth = 6

[memory.indexer]
pollMinutes = 60
maxFiles = 20000
maxFileBytes = 1000000
maxTotalBytes = 100000000
deadlineSeconds = 120

[pricing.openai]
# Official API-list rates are cached for exactly 24 hours. A failed refresh may
# use a clearly marked stale quote for at most this many hours.
enabled = true
maxStaleHours = 168

[drivers.codex]
adapter = "codex"
command = "/usr/local/bin/codex"
args = []
# Persistent Runner-specific vendor home. Authenticate and place deliberate
# Runner-wide Codex settings, instructions, and MCPs here.
home = "/var/lib/noriq-runner/drivers/codex"

[drivers.claude]
adapter = "claude"
command = "/usr/local/bin/claude"
args = []
# Shared by concurrent Runner Claude sessions; project-local .claude and
# .mcp.json configuration is still discovered from each task workspace.
home = "/var/lib/noriq-runner/drivers/claude"

# Future vendors can be registered without Runner code changes:
# [drivers.vendor]
# adapter = "external-jsonl-v1"
# command = "/opt/vendor/noriq-driver"
# args = []
# vendor = "vendor-id"
# [drivers.vendor.capabilities]
# workspaceAccess = ["read-only", "workspace-write"]
# runnerControlMcpInjection = true
# projectNativeConfiguration = true
# usageAccuracy = "exact"
# hardBudget = true
# processTreeTermination = true

[backends.git]
adapter = "git"
command = "/usr/bin/git"

[backends.diversion]
adapter = "diversion"
command = "/usr/local/bin/dv"

[backends.perforce]
adapter = "perforce"
command = "/usr/local/bin/p4"
