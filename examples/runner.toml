[runner]
id = "replace-with-registered-runner-id"
serverUrl = "https://noriq.example"
# Prefer an environment variable so this file can stay non-secret.
tokenEnv = "NORIQ_RUNNER_TOKEN"
stateDirectory = "/var/lib/noriq-runner"
scanRoots = ["/srv/projects"]
maxConcurrentJobs = 2

[drivers.codex]
adapter = "codex"
command = "/usr/local/bin/codex"
args = []
home = "/var/lib/noriq-runner/drivers/codex"

[drivers.claude]
adapter = "claude"
command = "/usr/local/bin/claude"
args = []
home = "/var/lib/noriq-runner/drivers/claude"

# Future vendors can be registered without Runner code changes:
# [drivers.vendor]
# adapter = "external-jsonl-v1"
# command = "/opt/vendor/noriq-driver"
# args = []
# [drivers.vendor.capabilities]
# workspaceAccess = ["read-only", "workspace-write"]
# runnerControlMcpInjection = true
# projectNativeConfiguration = true
# usageAccuracy = "exact"
# hardBudget = true
# processTreeTermination = true

[backends.git]
adapter = "git"
command = "/usr/bin/git"

[backends.diversion]
adapter = "diversion"
command = "/usr/local/bin/dv"

[backends.perforce]
adapter = "perforce"
command = "/usr/local/bin/p4"
